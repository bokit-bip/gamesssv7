    // High performance debounced filter (60fps guaranteed)

      const query = (searchInput.value || '').toLowerCase().trim();
      let visible = 0;
      cards.forEach(card => {
        const title = card.getAttribute('data-title') || '';
        const sanitized = card.getAttribute('data-sanitized') || '';
        const cat = card.getAttribute('data-category') || '';
        const matchesQuery = !query || title.includes(query) || sanitized.includes(query) || cat.includes(query);

        if (matchesQuery && matchesCategory) {
          card.style.display = 'flex';
          visible++;
        } else {
          card.style.display = 'none';
        }
      });
      if (counter) counter.textContent = `Showing ${visible} of ${cards.length} games`;
    }

    function queueFilter() {
      if (filterPending) cancelAnimationFrame(filterPending);
      filterPending = requestAnimationFrame(applyFilter);
    }

    searchInput.addEventListener('input', queueFilter);

      chip.addEventListener('click', () => {
        chips.forEach(c => c.classList.remove('active'));

      const titleEl = document.getElementById('player-game-title');

      }

      if (btn) {
        const card = btn.closest('.card');
        if (card) {
          const tEl = card.querySelector('.card-title');
          if (tEl) title = tEl.textContent.trim();
        }
      }
      if (!title) title = filename.replace(/\.html$/i, '').replace(/[-_]/g, ' ').toUpperCase();

      currentGameFilename = filename;
      currentGameFolder = folder;
      currentGameTitle = title;

      if (titleEl) titleEl.textContent = title;
      if (msgEl) msgEl.textContent = 'Launching ' + title + '...';
      if (spinner) { spinner.classList.remove('hidden'); spinner.style.display = 'flex'; }
      try {
        const curCloak = localStorage.getItem('bokit_tab_cloak') || 'drive';
        if (cloakDropdown) cloakDropdown.value = curCloak;
      } catch(e) {}

      modal.classList.remove('hidden');

      const slug = filename.replace(/\.html$/i, '');
      try {
        const curPath = window.location.pathname.split('/').pop() || 'index.svg';
        history.replaceState(null, '', curPath + '#play=' + encodeURIComponent(slug));
      } catch(e) {}

      const base = document.baseURI || window.location.href;
      const candidates = [];
      if (folder) {
        candidates.push(new URL('games/' + encodeURIComponent(folder) + '/index.html', base).href);
        candidates.push(new URL('content/' + encodeURIComponent(folder) + '/index.html', base).href);
      }
      candidates.push(new URL(filename, base).href);
      if (folder) {
        candidates.push('https://pop-leave.tailcb4af7.ts.net/games/' + encodeURIComponent(folder) + '/index.html');
      }

      async function tryLoadGame() {
        for (const targetUrl of candidates) {
          try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 2000);
            const r = await fetch(targetUrl, { signal: controller.signal });
            clearTimeout(timeout);
            if (r.ok) {
              const html = await r.text();
              const baseTag = '<base href="' + new URL('./', targetUrl).href + '">';
              let fullHtml = html;
              if (fullHtml.includes('<head>')) fullHtml = fullHtml.replace('<head>', '<head>' + baseTag);
              else if (fullHtml.includes('<html>')) fullHtml = fullHtml.replace('<html>', '<html><head>' + baseTag + '</head>');
              else fullHtml = baseTag + fullHtml;
              const blob = new Blob([fullHtml], { type: 'text/html' });
              iframe.src = URL.createObjectURL(blob);
              return;
            }
          } catch(err) {}
        }
        if (folder) {
          iframe.src = 'https://pop-leave.tailcb4af7.ts.net/games/' + encodeURIComponent(folder) + '/index.html';
        } else {
          iframe.src = new URL(filename, base).href;
        }
      }

      tryLoadGame();

      iframe.onload = function() {
        if (spinner) {
          spinner.classList.add('hidden');
          setTimeout(() => { spinner.style.display = 'none'; }, 200);
        }
        try {
          iframe.focus();
          if (iframe.contentWindow) iframe.contentWindow.focus();
        } catch(e) {}
      };
    }

    function closePlayer() {
      const modal = document.getElementById('modal-game-player');
      const iframe = document.getElementById('player-iframe');
      if (modal) modal.classList.add('hidden');
      if (iframe) iframe.src = 'about:blank';
      currentGameFilename = '';
      currentGameFolder = '';
      currentGameTitle = '';
      try {
        const curPath = window.location.pathname.split('/').pop() || 'index.svg';
        history.replaceState(null, '', curPath);
      } catch(e) {}
    }

    function reloadGame() {
      if (currentGameFilename) launchGame(currentGameFilename, currentGameFolder);
    }

    function togglePlayerFullscreen() {
      const modal = document.getElementById('modal-game-player');
      if (!document.fullscreenElement) (modal || document.documentElement).requestFullscreen().catch(() => {});
      else if (document.exitFullscreen) document.exitFullscreen();
    }

    function popoutCurrentGame() {
      if (currentGameFilename) openStealth(currentGameFilename, currentGameFolder);
    }

    function checkHashAutoLaunch() {
      let hash = window.location.hash || '';
      let search = window.location.search || '';
      if (!hash && window.__PARENT_SVG_HASH__) hash = window.__PARENT_SVG_HASH__;
      if (!search && window.__PARENT_SVG_SEARCH__) search = window.__PARENT_SVG_SEARCH__;
      let targetSlug = '';
      const m = /#(?:play=|game=)?([a-zA-Z0-9_-]+)/i.exec(hash);
      if (m && m[1]) targetSlug = m[1];
      else {
        try {
          const p = new URLSearchParams(search);
          if (p.get('game')) targetSlug = p.get('game');
        } catch(e) {}
      }
      if (targetSlug && targetSlug !== 'top' && targetSlug !== '') {
        const fname = targetSlug.endsWith('.html') ? targetSlug : targetSlug + '.html';
        const card = document.querySelector(`.card[data-file="${fname}"]`);
        const folder = card ? (card.getAttribute('data-folder') || '') : '';
        launchGame(fname, folder);
      }
    }

    window.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        if (searchInput) { searchInput.focus(); searchInput.select(); }
      } else if (e.key === '/' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        e.preventDefault();
        if (searchInput) { searchInput.focus(); searchInput.select(); }
      } else if (e.key === 'Escape') {
        const modal = document.getElementById('modal-game-player');
        if (modal && !modal.classList.contains('hidden')) {
          e.preventDefault();
          closePlayer();
        } else if (searchInput && document.activeElement === searchInput) {
          searchInput.value = '';
          queueFilter();
          searchInput.blur();
        }
      } else if ((e.key === 'r' || e.key === 'R') && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        const modal = document.getElementById('modal-game-player');
        if (modal && !modal.classList.contains('hidden')) { e.preventDefault(); reloadGame(); }
      } else if ((e.key === 'b' || e.key === 'B') && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        const modal = document.getElementById('modal-game-player');
        if (modal && !modal.classList.contains('hidden')) { e.preventDefault(); popoutCurrentGame(); }
      } else if ((e.key === 'f' || e.key === 'F') && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        const modal = document.getElementById('modal-game-player');
        if (modal && !modal.classList.contains('hidden')) { e.preventDefault(); togglePlayerFullscreen(); }
      }
    });

    window.addEventListener('DOMContentLoaded', checkHashAutoLaunch);
    window.addEventListener('hashchange', checkHashAutoLaunch);
  </script>
</body>
</html>
